name: Sync Upstream Metabase

# Rebases this fork's Teal commits onto the latest upstream release tag daily,
# keeping a clean linear history:  <upstream release> <- our commits on top.
#
# - Clean rebase: master is rebased onto the new release and force-pushed
#   automatically. That push to master triggers teal-docker-publish.yml, which
#   builds and publishes a branded image.
# - Conflicts: the job fails loudly with a resolution runbook in its summary and
#   an ::error:: annotation, so the failure notification surfaces it. Landing is
#   a manual force-push because a rebasing fork rewrites master on every sync, so
#   there is no cleanly mergeable PR (GitHub's merge would duplicate our commits).
#   Conflicts can only involve files we also touch: the theme files and
#   appearance/settings.clj.
#
# Requires a SYNC_TOKEN secret: a fine-grained PAT scoped to this repo with
# Contents and Workflows read/write permissions. Using a PAT (rather than the
# default GITHUB_TOKEN) is what lets the force-push to master trigger the Docker
# build workflow — pushes made with GITHUB_TOKEN do not trigger other workflows.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    name: Sync upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          TAG=$(gh api repos/metabase/metabase/releases/latest --jq '.tag_name')
          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "::error::Could not determine latest upstream release tag"
            exit 1
          fi
          git remote add upstream https://github.com/metabase/metabase.git
          git fetch upstream tag "$TAG" --no-tags

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $TAG"

      - name: Check sync status
        id: status
        run: |
          TAG="${{ steps.upstream.outputs.release_tag }}"

          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "result=already-synced" >> "$GITHUB_OUTPUT"
            echo "$TAG is already in master — nothing to do."
          else
            echo "result=needs-sync" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase Teal commits onto the new release
        if: steps.status.outputs.result == 'needs-sync'
        id: rebase
        run: |
          TAG="${{ steps.upstream.outputs.release_tag }}"

          # The upstream commit our Teal commits currently sit on. We must NOT use
          # `git merge-base master "$TAG"`: upstream release lines diverge, so the
          # merge-base is the point where the two lines split — replaying from there
          # would drag every upstream commit since that split (hundreds) back onto
          # the new release. Instead, anchor on our own stack: the "Apply Teal
          # branding" commit is always the foundation of the Teal commits, so its
          # parent is the upstream commit we sit on. Rebasing (OLD_BASE..master]
          # therefore replays exactly the handful of Teal commits and nothing else.
          TEAL_ROOT=$(git log --format='%H' -F --grep='Apply Teal branding' master | tail -1)
          if [[ -z "$TEAL_ROOT" ]]; then
            echo "::error::Could not locate the base Teal commit ('Apply Teal branding') on master."
            exit 1
          fi
          OLD_BASE="${TEAL_ROOT}~1"
          # Guard the force-push: only proceed if origin/master is where we left it.
          ORIG_MASTER=$(git rev-parse master)
          echo "old_base=$OLD_BASE"        >> "$GITHUB_OUTPUT"
          echo "orig_master=$ORIG_MASTER"  >> "$GITHUB_OUTPUT"
          echo "Rebasing $(git rev-list --count "$OLD_BASE"..master) Teal commit(s) from $OLD_BASE onto $TAG."

          git checkout -B sync-work master
          if git rebase --onto "$TAG" "$OLD_BASE" sync-work; then
            echo "outcome=clean" >> "$GITHUB_OUTPUT"
          else
            {
              echo "conflicts<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git rebase --abort
            echo "outcome=conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Land on master (clean rebase)
        if: steps.status.outputs.result == 'needs-sync' && steps.rebase.outputs.outcome == 'clean'
        run: |
          TAG="${{ steps.upstream.outputs.release_tag }}"
          ORIG_MASTER="${{ steps.rebase.outputs.orig_master }}"

          # Rewrite master to the rebased tip. --force-with-lease aborts if
          # origin/master moved since we read it (e.g. a concurrent push). This
          # push (made with the SYNC_TOKEN PAT) triggers teal-docker-publish.yml,
          # which builds the branded image from master and labels it $TAG.
          git push --force-with-lease="master:$ORIG_MASTER" origin sync-work:master
          echo "::notice::Rebased Teal commits onto $TAG and force-pushed master — Docker build will trigger automatically."

      - name: Report conflicts and fail
        if: steps.status.outputs.result == 'needs-sync' && steps.rebase.outputs.outcome == 'conflicts'
        env:
          CONFLICTS: ${{ steps.rebase.outputs.conflicts }}
          OLD_BASE: ${{ steps.rebase.outputs.old_base }}
        run: |
          TAG="${{ steps.upstream.outputs.release_tag }}"

          # Issues are disabled on this fork, so surface the conflict by failing
          # the job: the runbook lands in the job summary and the ::error::
          # annotation drives the failure notification.
          {
            echo "### Sync conflict — manual rebase required"
            echo ""
            echo "Rebasing our Teal commits onto upstream release \`$TAG\` hit conflicts. Because this fork keeps a linear history (our commits on top of upstream), the rebase and the force-push to \`master\` must be done locally — there is no mergeable PR."
            echo ""
            echo "#### Files with conflicts"
            echo '```'
            echo "$CONFLICTS"
            echo '```'
            echo ""
            echo "#### Resolve and land"
            echo '```bash'
            echo "git fetch origin && git checkout master && git reset --hard origin/master"
            echo "git remote add upstream https://github.com/metabase/metabase.git 2>/dev/null || true"
            echo "git fetch upstream tag $TAG --no-tags"
            echo ""
            echo "# Replay our commits onto the new release:"
            echo "git rebase --onto $TAG $OLD_BASE"
            echo "# ...resolve the <<<<<<< markers, then: git add -A && git rebase --continue"
            echo ""
            echo "# Land it (rewrites master) — the master push triggers the Docker build:"
            echo "git push --force-with-lease origin HEAD:master"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Rebasing Teal commits onto $TAG hit conflicts — see the job summary for the resolution runbook."
          exit 1

      - name: Summary
        if: always() && steps.rebase.outputs.outcome != 'conflicts'
        run: |
          TAG="${{ steps.upstream.outputs.release_tag }}"
          RESULT="${{ steps.status.outputs.result }}"
          OUTCOME="${{ steps.rebase.outputs.outcome }}"

          if   [[ "$RESULT" == "already-synced" ]]; then
            echo "### Already up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "$TAG is already in master — no action taken." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$OUTCOME" == "clean" ]]; then
            echo "### Synced automatically" >> "$GITHUB_STEP_SUMMARY"
            echo "Teal commits rebased onto $TAG and force-pushed to master — Docker build triggered." >> "$GITHUB_STEP_SUMMARY"
          fi
